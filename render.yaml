services:
  - type: web
    name: camagro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --worker-class gthread --threads 8
    healthCheckPath: /estado
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"

